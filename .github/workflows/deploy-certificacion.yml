name: Build and Deploy to S3

on:
  push:
    branches:
      - services-apiv2-desa

permissions:
  id-token: write
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.17.0'

    - name: Install dependencies
      run: npm install
   # Verificar si los secretos se pasan correctamente
    - name: Verificar secretos
      run: |
       echo "Bucket Name: ${{secrets.AWS_BUCKET_SERVICES_V2_KDESA}}"
       echo "Región: ${{secrets.AWS_REGION_SERVICES}}"
       echo "Rol: ${{secrets.AWS_ACCESS_SERVICES_V2_KDESA}}"

    - name: Build project with the correct environment configuration
      run: npm run build-desa:single-spa:singularlabs-mf-services

    # - name: DEBUG - Ver token OIDC real
    #   run: |
    #     echo "Solicitando token OIDC..."
    #     JWT=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
    #       "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
        
    #     echo "Payload del token (decodificado):"
    #     echo "$JWT" | cut -d "." -f2 | base64 -d 2>/dev/null | jq .

    - name: Connect to AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-session-name: awssyncsession
        role-to-assume: ${{secrets.AWS_ACCESS_SERVICES_V2_KDESA}}
        aws-region: ${{secrets.AWS_REGION_SERVICES}}

    - name: Update to S3
      run: aws s3 sync ./dist/ s3://${{secrets.AWS_BUCKET_SERVICES_V2_KDESA}}/singularlabs-mf-services --delete

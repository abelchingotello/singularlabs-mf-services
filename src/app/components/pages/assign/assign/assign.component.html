<div class="content bg-gray-3">
  <div class="container-fluid px-2 px-md-5 pb-2 pt-4 py-md-4">
    <uni-image-card title="Asignación de servicios"
      externImage="https://img.freepik.com/vector-gratis/red-social-servicio-citas-online-chat-comunicacion-internet-personaje-dibujos-animados-nina-mirando-perfiles-foto-ilustracion-concepto-redes-sociales_335657-2041.jpg?semt=ais_hybrid&w=740"
      size="8%">

      <div class="align-content-center">
        <button mat-flat-button type="button" class="mb-2 mb-md-0 custom-button btn-dark me-2"
          (click)="redirectAsign(1)">
          <mat-icon>add</mat-icon>
          <span class="custom-span-icon-responsive">Añadir</span>
        </button>

        <button mat-flat-button type="button" class="mb-2 mb-md-0 custom-button btn-dark" (click)="redirectAsign(2)">
          <mat-icon>upload_file</mat-icon>
          <span class="custom-span-icon-responsive">Importar</span>
        </button>
      </div>
    </uni-image-card>

    <mat-card class="custom-border-radius-1-25">
      <mat-card-content>
        <h2 style="margin-top: 23px; margin-left: 20px;"> Datos de Búsqueda </h2>
        <form [formGroup]="assignServiceForm"
          class="d-flex align-items-center justify-content-space-evenly flex-wrap mt-3">

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Tipo de Servicio</mat-label>
            <mat-select formControlName="service_type">
              <mat-option *ngFor="let category of categoriesService"
                [value]="category.master_idTypeService">{{category.master_name}}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Nombre de Servicio</mat-label>
            <input formControlName="service_name" matInput type="text" />
          </mat-form-field>

        </form>

      </mat-card-content>

      <div style="display: flex;
                        padding-right: 15px;
                        flex-direction: row;
                        justify-content: flex-end;
                        margin-bottom: 10px;">

        <button type="button" class="btn-primary btn" (click)="clearFormAndData()">
          Limpiar
        </button>
        <button type="button" class="btn-primary btn" (click)="searchData()">
          Buscar
        </button>
      </div>
    </mat-card>

    <mat-card class="custom-border-radius-1-25">
      <mat-card-content>
        <div>
          <uni-dynamic-table [columns]="columns" [data]="dataService" [pageKey]="pageKey"
            [refreshFunction]="reload.bind(this)" (pageChange)="onPageChange($event)" [lengthTable]="count">
          </uni-dynamic-table>
        </div>
      </mat-card-content>
    </mat-card>

  </div>
</div>

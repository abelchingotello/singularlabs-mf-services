<div class="content bg-gray-3">
  <div class="container-fluid px-2 px-md-5 pb-2 pt-4 py-md-4">
    <uni-image-card title="Servicios"
      externImage="https://360degreecloud.com/wp-content/uploads/2021/11/banner-01-1.png" size="10%">
      <div class="row">
        <div class="col  d-flex justify-content-end align-items-end ">

          <button type="button" class="mb-2 mb-md-0 custom-button btn button-tertiary me-2 " (click)="addService()"
            *ngIf="authService.permissions?.['services-create-individual']">
            <mat-icon>add</mat-icon>
            <span class="custom-span-icon-responsive">Añadir</span>
          </button>

          <button type="button" class="mb-2 mb-md-0 custom-button btn button-tertiary me-2" (click)="createService()"
            *ngIf="authService.permissions?.['services-create-massive']">
            <mat-icon>upload_file</mat-icon>
            <span class="custom-span-icon-responsive">Importar-Crear</span>
          </button>

          <button type="button" class="mb-2 mb-md-0 custom-button btn button-tertiary " (click)="updateService()"
            *ngIf="authService.permissions?.['services-updates-massive']">
            <mat-icon>upload_file</mat-icon>
            <span class="custom-span-icon-responsive">Importar-Actualizar</span>
          </button>
        </div>
      </div>
    </uni-image-card>

    <mat-card class="custom-border-radius-1-25">
      <mat-card-content>
        <h2 class="mt-4 ml-3 text-default"> Datos de Búsqueda </h2>
        <form [formGroup]="serviceForm" class="d-flex flex-wrap ">

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Estado</mat-label>
            <mat-select formControlName="status">
              <mat-option [value]="">NINGUNO</mat-option>
              <mat-option *ngFor="let status of stateMaster" [value]="status">
                {{status.master_name}}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Tipo de Servicio</mat-label>
            <mat-select formControlName="service_type" (selectionChange)="selectCategory()">
              <mat-option [value]="">NINGUNO</mat-option>
              <mat-option *ngFor="let category of categoriesService"
                [value]="category.master_name">{{category.master_name}}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3" *ngIf="selectedCategory">
            <mat-label>Seleccionar Servicio</mat-label>
            <mat-select formControlName="idService" multiple (selectionChange)="onServicesChange($event)">

              <!-- Input de búsqueda -->
              <mat-option disabled class="search-option" *ngIf="selectedCategory">
                <input matInput placeholder="Buscar servicio..." [(ngModel)]="serviceFilter"
                  [ngModelOptions]="{standalone: true}" (ngModelChange)="filterServices()"
                  (click)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation()"
                  (keydown.enter)="$event.stopPropagation()" />
              </mat-option>

              <!-- Input de Listado de Servicios Listados-->
              <mat-option disabled *ngIf="selectedCategory">
                <input matInput placeholder="Servicios Listados..." [value]="servicesNames" />
              </mat-option>

              <!-- Mostrar los servicios filtrados -->
              <mat-option *ngFor="let service of filteredServices" [value]="service.id">
                {{ service.name }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3" *ngIf="!selectedCategory">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="service_name">
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Proveedor</mat-label>
            <mat-select formControlName="provider">
              <mat-option [value]="">NINGUNO</mat-option>
              <mat-option *ngFor="let provider of listProviders" [value]="provider.servicePerson.idPerson">
                {{provider.servicePerson.nameAlias}}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>ID Servicio</mat-label>
            <input matInput formControlName="service_id">
          </mat-form-field>

        </form>
        <div class="row">
          <div class="col lg-6 d-flex justify-content-end align-items-end mb-3 mr-3" style="margin-top: 0px;">

            <button title="Limpiar" type="button" class="btn button-secondary" (click)="clearFormAndData()">
              <mat-icon>filter_alt_off</mat-icon>
              Limpiar
            </button>
            <button type="button" class="btn button-primary" (click)="searchData()">
              <mat-icon>search</mat-icon>
              Buscar
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <mat-card class="custom-border-radius-1-25">
      <mat-card-content>
        <div>
          <uni-dynamic-table [columns]="columns" [data]="dataService" element_id="id" [pageKey]="pageKey"
            [refreshFunction]="reload.bind(this)" (pageChange)="onPageChange($event)" [lengthTable]="count"
            [customExportFunction]="exportDataViaAPI.bind(this)" (clickButtonEvent)="clickButton($event)">

          </uni-dynamic-table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>

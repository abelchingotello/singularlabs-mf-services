        <button  type="button" class="mb-2 mb-md-0 custom-button btn btn-default4 me-2" (click)="createService()">

        </button>
      </div>
      </div>

    <mat-card class="custom-border-radius-1-25">
      <mat-card-content>
        <h2 class="mt-4 ml-3 text-default"> Datos de Búsqueda </h2>
        <form [formGroup]="serviceForm" class="d-flex align-items-center justify-content-space-evenly flex-wrap ">

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Estado</mat-label>
            <mat-select formControlName="status">
              <mat-option *ngFor="let status of stateMaster" [value]="status">
                {{status.master_name}}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Tipo de Servicio</mat-label>
            <mat-select formControlName="service_type">
              <mat-option *ngFor="let category of categoriesService"
                [value]="category.master_name">{{category.master_name}}</mat-option>
            </mat-select>
          </mat-form-field>

          <mat-form-field appearance="outline" class="col-md-3">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="service_name">
          </mat-form-field>

        </form>
        <div class="row">
          <div class="col lg-6 d-flex justify-content-end align-items-end mb-3 mr-3" style="margin-top: 0px;">

            <button title="Limpiar" type="button" class="btn btn-default2" (click)="clearFormAndData()">
              <mat-icon>filter_alt_off</mat-icon>
              Limpiar
            </button>
            <button type="button" class="btn btn-default3" (click)="searchData()">
              <mat-icon>search</mat-icon>
              Buscar
            </button>
        </div>
        </div>
      </mat-card-content>

      
    </mat-card>

    <mat-card class="custom-border-radius-1-25">
      <mat-card-content>
        <div>
          <uni-dynamic-table [columns]="columns" [data]="dataService" [actionsOptions]="true" element_id="id"
            [pageKey]="pageKey" (selectedIdsChange)="handleSelectedIds($event)"
            (selectedChange)="selectedHandle($event)" [refreshFunction]="reload.bind(this)"
            (pageChange)="onPageChange($event)" [lengthTable]="count">

            <div class="d-flex">
              <button class="icon-button" [disabled]="disabledEditOption" mat-icon-button (click)="asignationService()">
                <mat-icon matTooltip="Asignar" matTooltipPosition="above">assignment_ind</mat-icon>
              </button>
              <mat-form-field *ngIf="editOption" appearance="outline" style="width: 80%; margin-left: 15px;">
                <mat-label>Actualizar</mat-label>

                <mat-select (selectionChange)="selectOption($event)">
                  <!-- <mat-option>Ninguno</mat-option> -->
                  <mat-option *ngFor="let option of options" [value]="option">{{option.value}}</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </uni-dynamic-table>
        </div>
      </mat-card-content>
    </mat-card>



  </div>
</div>

<div mat-dialog-content>
  <p>¿Actualizar estado del usuario?</p>
  <mat-form-field class="col-md-6" appearance="outline">
    <mat-label>Persona</mat-label>
    <input type="text" matInput [(ngModel)]="personInput" disabled>
  </mat-form-field>
   <mat-form-field class="col-md-6" appearance="outline">
    <mat-label>Estado</mat-label>
    <input type="text" matInput [(ngModel)]="status" disabled>
  </mat-form-field>
</div>
<div class="d-flex justify-content-end">
  <button mat-button (click)="onNoClick()" class="btn btn-default2" >Cancelar</button>
  <button mat-button  class="btn btn-default3" cdkFocusInitial (click)="updatestate()">
    <mat-icon>update</mat-icon>
    Actualizar
  </button>
</div>
